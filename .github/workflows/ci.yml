name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint + typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTH_SECRET: ci-auth-secret-do-not-use-in-production-please-32
      CREATOR_EMAIL: s.gonzalez.garza@gmail.com
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        env:
          NODE_ENV: production
        run: pnpm build

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AUTH_SECRET: ci-auth-secret-do-not-use-in-production-please-32
      CREATOR_EMAIL: s.gonzalez.garza@gmail.com
      SIFTY_DISABLE_AUTH: "1"
      SIFTY_AI_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm playwright install --with-deps chromium

      - name: Build
        env:
          NODE_ENV: production
        run: pnpm build

      - name: Run e2e smoke
        run: pnpm test:e2e
