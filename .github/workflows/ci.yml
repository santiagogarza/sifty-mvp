name: CI

on:
  push:
    branches: [master, main, production]
  pull_request:
    branches: [master, main, production]

permissions:
  contents: read

jobs:
  verify:
    name: Lint + typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BETTER_AUTH_SECRET: ci-auth-secret-do-not-use-in-production-please-32
      CREATOR_EMAIL: s.gonzalez.garza@gmail.com
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        env:
          NODE_ENV: production
        run: pnpm build

  db:
    name: Postgres repo tests (production only)
    # Only for the production branch and PRs into it; master's demo CI is unchanged.
    if: github.ref_name == 'production' || github.base_ref == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sifty
          POSTGRES_PASSWORD: sifty
          POSTGRES_DB: sifty_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sifty"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTH_SECRET: ci-auth-secret-do-not-use-in-production-please-32
      CREATOR_EMAIL: s.gonzalez.garza@gmail.com
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://sifty:sifty@localhost:5432/sifty_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate
        env:
          DATABASE_URL: postgres://sifty:sifty@localhost:5432/sifty_test
        run: pnpm db:migrate

      - name: Postgres repo tests
        run: pnpm vitest run tests/db

  smoke:
    name: Smoke the production deployment
    # Pushes to production only: wait for Vercel's GitHub Deployment for this
    # commit to succeed, then probe the live URL. Previews are behind Vercel
    # Authentication and need a bypass secret; that is a follow-up.
    if: github.event_name == 'push' && github.ref_name == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@v5

      - name: Wait for the Vercel production deployment of ${{ github.sha }}
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            dep=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${GITHUB_SHA}&environment=Production&per_page=1" --jq '.[0].id // empty')
            if [ -n "$dep" ]; then
              state=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/$dep/statuses?per_page=1" --jq '.[0].state // empty')
              url=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/$dep/statuses?per_page=1" --jq '.[0].environment_url // empty')
              echo "deployment $dep state=${state:-pending}"
              case "$state" in
                success) echo "url=$url" >> "$GITHUB_OUTPUT"; exit 0 ;;
                failure|error) echo "Vercel deployment failed: $url"; exit 1 ;;
              esac
            else
              echo "no Production deployment for ${GITHUB_SHA} yet"
            fi
            sleep 15
          done
          echo "timed out waiting for the Vercel deployment"; exit 1

      - name: Probe the deployment URL
        run: bash scripts/smoke-deployment.sh "${{ steps.wait.outputs.url }}"

      - name: Probe the stable production alias
        run: bash scripts/smoke-deployment.sh https://sifty-app.vercel.app

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BETTER_AUTH_SECRET: ci-auth-secret-do-not-use-in-production-please-32
      CREATOR_EMAIL: s.gonzalez.garza@gmail.com
      SIFTY_DISABLE_AUTH: "1"
      SIFTY_AI_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm playwright install --with-deps chromium

      - name: Build
        env:
          NODE_ENV: production
        run: pnpm build

      - name: Run e2e smoke
        run: pnpm test:e2e
