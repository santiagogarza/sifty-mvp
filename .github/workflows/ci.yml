name: CI

on:
  push:
    branches: [master, main, production]
  pull_request:
    branches: [master, main, production]

permissions:
  contents: read

jobs:
  verify:
    name: Lint + typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BETTER_AUTH_SECRET: ci-auth-secret-do-not-use-in-production-please-32
      CREATOR_EMAIL: s.gonzalez.garza@gmail.com
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        env:
          NODE_ENV: production
        run: pnpm build

  db:
    name: Postgres repo tests (production only)
    # Only for the production branch and PRs into it; master's demo CI is unchanged.
    if: github.ref_name == 'production' || github.base_ref == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sifty
          POSTGRES_PASSWORD: sifty
          POSTGRES_DB: sifty_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sifty"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTH_SECRET: ci-auth-secret-do-not-use-in-production-please-32
      CREATOR_EMAIL: s.gonzalez.garza@gmail.com
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://sifty:sifty@localhost:5432/sifty_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate
        env:
          DATABASE_URL: postgres://sifty:sifty@localhost:5432/sifty_test
        run: pnpm db:migrate

      - name: Postgres repo tests
        run: pnpm vitest run tests/db

  evals:
    name: Prompt evals (offline, production only)
    # Deterministic: every stage answers with the offline heuristic, so this
    # needs no key and fails only on schema/rubric regressions or a prompt
    # edited without a version bump. Cost drift is a warning annotation.
    # Real-model runs live in evals-nightly.yml.
    if: github.ref_name == 'production' || github.base_ref == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SIFTY_AI_OFFLINE: "1"
      CREATOR_EMAIL: s.gonzalez.garza@gmail.com
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Eval
        run: pnpm eval

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-offline-${{ github.sha }}
          path: evals/.results/
          if-no-files-found: ignore
          retention-days: 14

  smoke:
    name: Smoke the production deployment
    # Pushes to production only: wait for Vercel's GitHub Deployment for this
    # commit to succeed, then probe the live URL. Previews are behind Vercel
    # Authentication and need a bypass secret; that is a follow-up.
    if: github.event_name == 'push' && github.ref_name == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@v5

      - name: Wait for the Vercel production deployment of ${{ github.sha }}
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            dep=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${GITHUB_SHA}&environment=Production&per_page=5" \
              --jq '[.[]|select(.creator.login=="vercel[bot]")][0].id // empty')
            if [ -n "$dep" ]; then
              status=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/$dep/statuses?per_page=1" --jq '.[0] // empty')
              state=$(printf '%s' "$status" | jq -r '.state // "pending"')
              url=$(printf '%s' "$status" | jq -r '.environment_url // ""')
              echo "deployment $dep state=$state"
              case "$state" in
                success)
                  # The whole value must be a bare https origin on an allowed host:
                  # no path, query, fragment, userinfo, port, or stray characters.
                  if [[ "$url" =~ ^https://([a-z0-9-]+-santiagogarzas-projects\.vercel\.app)/?$ ]]; then
                    echo "url=https://${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"; exit 0
                  fi
                  printf 'environment_url is not an allowed production origin: %q\n' "$url"; exit 1 ;;
                failure|error|inactive) echo "Vercel deployment did not succeed ($state)"; exit 1 ;;
              esac
            else
              echo "no vercel[bot] Production deployment for ${GITHUB_SHA} yet"
            fi
            sleep 15
          done
          echo "timed out waiting for the Vercel deployment"; exit 1

      - name: Probe the deployment URL
        env:
          SMOKE_URL: ${{ steps.wait.outputs.url }}
        run: bash scripts/smoke-deployment.sh "$SMOKE_URL"

      - name: Probe the stable production alias
        run: bash scripts/smoke-deployment.sh https://sifty-app.vercel.app

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BETTER_AUTH_SECRET: ci-auth-secret-do-not-use-in-production-please-32
      CREATOR_EMAIL: s.gonzalez.garza@gmail.com
      SIFTY_DISABLE_AUTH: "1"
      SIFTY_AI_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm playwright install --with-deps chromium

      - name: Build
        env:
          NODE_ENV: production
        run: pnpm build

      - name: Run e2e smoke
        run: pnpm test:e2e
