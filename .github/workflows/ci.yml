name: CI

on:
  push:
    branches: [master, main, production]
  pull_request:
    branches: [master, main, production]

permissions:
  contents: read

jobs:
  verify:
    name: Lint + typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BETTER_AUTH_SECRET: ci-auth-secret-do-not-use-in-production-please-32
      CREATOR_EMAIL: s.gonzalez.garza@gmail.com
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        env:
          NODE_ENV: production
        run: pnpm build

  db:
    name: Postgres repo tests (production only)
    # Only for the production branch and PRs into it; master's demo CI is unchanged.
    if: github.ref_name == 'production' || github.base_ref == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sifty
          POSTGRES_PASSWORD: sifty
          POSTGRES_DB: sifty_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sifty"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTH_SECRET: ci-auth-secret-do-not-use-in-production-please-32
      CREATOR_EMAIL: s.gonzalez.garza@gmail.com
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://sifty:sifty@localhost:5432/sifty_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate
        env:
          DATABASE_URL: postgres://sifty:sifty@localhost:5432/sifty_test
        run: pnpm db:migrate

      - name: Postgres repo tests
        run: pnpm vitest run tests/db

  evals:
    name: Prompt evals (offline, production only)
    # Deterministic: every stage answers with the offline heuristic, so this
    # needs no key and fails only on schema/rubric regressions or a prompt
    # edited without a version bump. Cost drift is a warning annotation.
    # Real-model runs live in evals-nightly.yml.
    if: github.ref_name == 'production' || github.base_ref == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SIFTY_AI_OFFLINE: "1"
      CREATOR_EMAIL: s.gonzalez.garza@gmail.com
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Eval
        run: pnpm eval

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-offline-${{ github.sha }}
          path: evals/.results/
          if-no-files-found: ignore
          retention-days: 14

  smoke:
    name: Smoke the production deployment
    # Pushes to production only: wait until the live alias reports this
    # commit in /api/health (`release` is the short VERCEL_GIT_COMMIT_SHA),
    # then probe it. Vercel's GitHub Deployment record is not reliable enough
    # to gate on (it never appeared for d9188fe), so it is only used for the
    # inspector link. Previews are behind Vercel Authentication and need a
    # bypass secret; that is a follow-up.
    if: github.event_name == 'push' && github.ref_name == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      deployments: read
    env:
      SMOKE_URL: https://sifty-app.vercel.app
    steps:
      - uses: actions/checkout@v5

      - name: Wait until ${{ env.SMOKE_URL }} serves ${{ github.sha }}
        run: |
          set -euo pipefail
          want="${GITHUB_SHA:0:7}"
          for i in $(seq 1 80); do
            body=$(curl -sS --max-time 20 "$SMOKE_URL/api/health" || true)
            release=$(printf '%s' "$body" | jq -r '.release // ""' 2>/dev/null || true)
            echo "$(date -u +%H:%M:%S) release=${release:-?} (want $want)"
            if [ "$release" = "$want" ]; then exit 0; fi
            sleep 15
          done
          echo "timed out: $SMOKE_URL never reported release $want"; exit 1

      - name: Probe the stable production alias
        run: bash scripts/smoke-deployment.sh "$SMOKE_URL"

      - name: Vercel inspector link (informational)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dep=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${GITHUB_SHA}&environment=Production&per_page=5" \
            --jq '[.[]|select(.creator.login=="vercel[bot]")][0].id // empty' || true)
          if [ -z "$dep" ]; then echo "no vercel[bot] GitHub deployment record for ${GITHUB_SHA} (not required)"; exit 0; fi
          gh api "repos/${GITHUB_REPOSITORY}/deployments/$dep/statuses?per_page=1" \
            --jq '.[0] | "state=\(.state) log=\(.log_url // "") url=\(.environment_url // "")"' || true

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BETTER_AUTH_SECRET: ci-auth-secret-do-not-use-in-production-please-32
      CREATOR_EMAIL: s.gonzalez.garza@gmail.com
      SIFTY_DISABLE_AUTH: "1"
      SIFTY_AI_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm playwright install --with-deps chromium

      - name: Build
        env:
          NODE_ENV: production
        run: pnpm build

      - name: Run e2e smoke
        run: pnpm test:e2e
