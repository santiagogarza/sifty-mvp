name: Evals (real models)

# Runs the golden capture set against real models and fails on schema or
# rubric regressions; cost drift is a warning in the step summary.
#
# GitHub only fires `schedule` triggers from the repository's default branch
# (`master`), so this file must also exist there (Santi lands it via a PR
# into `master`); the jobs always check out and evaluate `production`.
#
#   - gateway: every night. Secret: AI_GATEWAY_API_KEY.
#   - direct:  Mondays only, to cap spend. Secrets: ANTHROPIC_API_KEY, OPENAI_API_KEY.
#
# Either can be started by hand from the Actions tab (workflow_dispatch).
#
# Secrets live on the `evals` GitHub Environment, not as plain repository
# secrets: the environment's deployment-branch policy is set to `production`
# (and `master`, where the schedule fires), so a branch pushed by any writer
# cannot dispatch this workflow with the live provider keys in its env. The
# checkout is pinned to `production` for the same reason; there is no ref
# input.

on:
  schedule:
    - cron: "0 4 * * *" # gateway, daily 04:00 UTC
    - cron: "0 5 * * 1" # direct, Mondays 05:00 UTC
  workflow_dispatch:
    inputs:
      transport:
        description: AI transport to evaluate
        type: choice
        options: [gateway, direct]
        default: gateway

permissions:
  contents: read

jobs:
  gateway:
    name: Golden set via AI Gateway
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 4 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.transport == 'gateway')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: evals
    env:
      AI_TRANSPORT: gateway
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      CREATOR_EMAIL: s.gonzalez.garza@gmail.com
      NODE_ENV: test
    steps:
      - name: Require the Gateway secret
        run: |
          if [ -z "${AI_GATEWAY_API_KEY}" ]; then
            echo "::error::AI_GATEWAY_API_KEY is not set on the 'evals' environment (Settings → Environments → evals → Environment secrets)."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: production
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Eval
        run: pnpm eval
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-gateway-${{ github.run_id }}
          path: evals/.results/
          if-no-files-found: ignore
          retention-days: 30

  direct:
    name: Golden set via direct provider APIs
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 5 * * 1') ||
      (github.event_name == 'workflow_dispatch' && inputs.transport == 'direct')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: evals
    env:
      AI_TRANSPORT: direct
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CREATOR_EMAIL: s.gonzalez.garza@gmail.com
      NODE_ENV: test
    steps:
      - name: Require the provider secrets
        run: |
          missing=""
          [ -z "${ANTHROPIC_API_KEY}" ] && missing="$missing ANTHROPIC_API_KEY"
          [ -z "${OPENAI_API_KEY}" ] && missing="$missing OPENAI_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing secret(s) on the 'evals' environment:$missing (every stage has an OpenAI fallback, so both are needed for AI_TRANSPORT=direct)."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: production
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Eval
        run: pnpm eval
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-direct-${{ github.run_id }}
          path: evals/.results/
          if-no-files-found: ignore
          retention-days: 30
